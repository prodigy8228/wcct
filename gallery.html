<!-- Lightbox Modal Backdrop -->
<div id="galleryLightbox" class="lightbox-overlay" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img id="lightboxImage" class="lightbox-content" src="" alt="Enlarged view" />
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }
    });
},{threshold:.15});

document.querySelectorAll(".fade-up").forEach(el=>{
    observer.observe(el);
});
function openLightbox(element) {
    const src = element.querySelector('img').getAttribute('src');
    document.getElementById('lightboxImage').setAttribute('src', src);
    document.getElementById('galleryLightbox').style.display = 'flex';
}

function closeLightbox() {
    document.getElementById('galleryLightbox').style.display = 'none';
}

</script>
